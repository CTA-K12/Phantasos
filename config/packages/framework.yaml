# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # No reverse proxy sits in front of Phantasos: its own nginx terminates TLS and
    # talks FastCGI (with HTTPS=on), so no X-Forwarded-* header is trusted. Trusting
    # REMOTE_ADDR here would let any client forge X-Forwarded-Host, and the API builds
    # upload URLs from the host. If a proxy/WAF is added later, list its address in
    # TRUSTED_PROXIES.
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']

when@prod:
    framework:
        # Only the two published names; anything else is rejected before routing.
        trusted_hosts: '%env(TRUSTED_HOSTS)%'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
