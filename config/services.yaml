# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Defaults so a missing variable never breaks a boot; production sets these in
    # .docker/php/env.defaults / the host env file.
    env(APP_NAME): 'Phantasos'
    env(TRUSTED_HOSTS): '^(phantasos\.mesd\.k12\.or\.us|phantasos\.apps\.cascadetech\.org)$'
    env(MEDIA_ROOT): '%kernel.project_dir%/var/media'
    env(MEDIA_ACCEL_PREFIX): ''
    env(FFMPEG_BINARY): 'ffmpeg'
    env(FFPROBE_BINARY): 'ffprobe'
    env(FFMPEG_THREADS): '0'
    env(MESSENGER_TRANSPORT_DSN): 'doctrine://default?auto_setup=0'
    app.media_root: '%env(resolve:MEDIA_ROOT)%'
    app.media_accel_prefix: '%env(MEDIA_ACCEL_PREFIX)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    _instanceof:
        App\Processor\ProcessorInterface:
            tags: ['app.processor']

    App\Service\MediaStorage:
        arguments:
            $mediaRoot: '%app.media_root%'

    App\Service\Processing\ProcessorRegistry:
        arguments:
            $processors: !tagged_iterator app.processor

    App\Service\Processing\Ffmpeg:
        arguments:
            $ffmpegBinary: '%env(FFMPEG_BINARY)%'
            $ffprobeBinary: '%env(FFPROBE_BINARY)%'
            $threads: '%env(int:FFMPEG_THREADS)%'

    App\Service\MediaFileResponder:
        arguments:
            $accelPrefix: '%app.media_accel_prefix%'

    App\Security\GoogleAuthenticator:
        arguments:
            $googleHostedDomain: '%env(GOOGLE_HOSTED_DOMAIN)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
