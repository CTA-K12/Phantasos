date.timezone = America/Los_Angeles
expose_php = Off

; Uploads: the legacy server accepted 1 GB. The temp dir is on the encrypted /media
; volume so an in-flight upload (possibly ePHI) never lands on the container's
; overlay filesystem, and the final move into place is a rename, not a copy.
upload_max_filesize = 1G
post_max_size = 1G
upload_tmp_dir = /media/.upload-tmp
max_execution_time = 600
max_input_time = 600
memory_limit = 512M

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
