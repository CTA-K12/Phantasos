[phantasos]
user = nobody
group = nobody
listen = 0.0.0.0:9001

; PHP has no connection pooling: each busy worker holds one PostgreSQL backend.
; appdev-pg-prod's connection budget is shared with every other app, so keep this
; modest. The Dockerfile default (8) is load-bearing: an unset variable expands to
; empty and php-fpm refuses to start.
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 1000

; Pass the container environment through to PHP. Safe here: the container's
; environment is exactly the app's config (one process, one app).
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
