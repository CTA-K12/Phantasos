# Runs as the unprivileged `nginx` user: no `user` directive, high ports only
# (the host publishes 443->8443 and 80->8080), pid and temp paths it owns.
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;

    client_body_temp_path /var/lib/nginx/tmp/client_body;
    proxy_temp_path       /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path        /var/lib/nginx/tmp/scgi;

    # Keys still arrive in the query string from legacy consumers: never log it.
    # Log the client's original path ($uri would show internal rewrites instead).
    map $request_uri $request_path {
        ~^(?<path>[^?]*) $path;
    }
    log_format noquery '$remote_addr - [$time_local] "$request_method $request_path $server_protocol" '
                       '$status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /dev/stdout noquery;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    include /etc/nginx/http.d/*.conf;
}
