# Phantasos — answers on both names (one certificate covers both):
#   phantasos.mesd.k12.or.us        production name consumers use
#   phantasos.apps.cascadetech.org  test name before the DNS flip
#
# TLS cert/key are mounted at /etc/nginx/tls/ by the host (Let's Encrypt, renewed
# on the host; reload nginx after renewal).

upstream php {
    server phantasos-app:9001;
}

# Any other Host header is dropped — the API builds upload URLs from the Host.
server {
    listen 8080 default_server;
    listen 8443 ssl default_server;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    return 444;
}

server {
    listen 8080;
    server_name phantasos.mesd.k12.or.us phantasos.apps.cascadetech.org;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name phantasos.mesd.k12.or.us phantasos.apps.cascadetech.org;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    root /var/www/phantasos/public;

    # Matches the legacy 1 GB upload limit (and PHP's post_max_size).
    client_max_body_size 1g;


    # File delivery. Only reachable through X-Accel-Redirect from PHP, after the
    # key and ownership checks; a client requesting /_media/ directly gets 404.
    location /_media/ {
        internal;
        alias /media/phantasos/;
        # Content-Type and Cache-Control: private come from PHP's response.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Browser uploads: stream the body straight to PHP-FPM instead of buffering a
    # 1 GB request to nginx's own temp dir first (that dir is not on /media).
    location ^~ /api/uploadMedia/ {
        # Public like the rest of /api/ (browser uploads with a one-time ticket).
        fastcgi_request_buffering off;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/phantasos/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/phantasos/public;
        fastcgi_param HTTPS on;
        fastcgi_pass php;
    }

    # Public API: consumers anywhere on the internet. index.php is reached by an
    # internal redirect, which re-runs location matching, so the allowlist on `/`
    # below never applies to /api/ requests.
    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    # Everything else is the management site (sign-in, admin, static files):
    # internal networks only. Checked in nginx's access phase, before try_files.
    location / {
        include /etc/nginx/admin-access.conf;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/phantasos/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/phantasos/public;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
        fastcgi_pass php;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
