# Who may reach the management site (everything except /api/). The public API is
# not affected. Default: private address ranges only.
#
# Override on the host by mounting a replacement at /etc/nginx/admin-access.conf
# (e.g. the MESD/NWRESD egress ranges if staff reach the server via its public IP).
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow 127.0.0.1;
deny all;
